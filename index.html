<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paraíso das Novinhas — Verificação de Idade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg:        #0e0719;
  --fg:        #f5f0fc;
  --fg2:       #a892c8;
  --accent:    #7c3aed;
  --accent2:   #9f5cf7;
  --accent3:   #c084fc;
  --font-serif:'DM Serif Display', Georgia, serif;
  --font-body: 'Inter', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
}
body {
  background: var(--bg);
  background-image: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(90,30,180,.28) 0%, transparent 70%);
  color: var(--fg);
  font-family: var(--font-body);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}
.box {
  text-align: center;
  max-width: 420px;
  width: 100%;
}
.logo {
  font-family: var(--font-serif);
  font-size: 15px;
  letter-spacing: .08em;
  color: var(--accent3);
  text-transform: uppercase;
  margin-bottom: 40px;
  opacity: .8;
}
.icon {
  font-size: 52px;
  margin-bottom: 24px;
  display: block;
}
h1 {
  font-family: var(--font-serif);
  font-size: clamp(26px, 7vw, 40px);
  line-height: 1.2;
  margin-bottom: 12px;
  color: var(--fg);
}
h1 em {
  color: var(--accent3);
  font-style: italic;
}
.sub {
  color: var(--fg2);
  font-size: 14px;
  margin-bottom: 44px;
  line-height: 1.6;
}
.btn {
  display: inline-block;
  width: 100%;
  max-width: 280px;
  padding: 18px 0;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  letter-spacing: .04em;
  box-shadow: 0 0 32px rgba(124,58,237,.55);
  transition: transform .15s, box-shadow .15s;
  text-decoration: none;
}
.btn:hover { transform: scale(1.04); box-shadow: 0 0 48px rgba(124,58,237,.75); }
.btn:active { transform: scale(.98); }
.warn {
  margin-top: 22px;
  font-size: 11px;
  color: var(--fg2);
  opacity: .55;
  line-height: 1.5;
}
/* subtle divider line */
.divider {
  width: 40px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent3), transparent);
  margin: 0 auto 32px;
  border-radius: 2px;
}
</style>
</head>
<body>
<div class="box">
  <p class="logo">Paraíso das Novinhas</p>
  <span class="icon">🔞</span>
  <h1>Você tem mais de<br><em>18 anos, amor?</em></h1>
  <div class="divider"></div>
  <p class="sub">Este site contém conteúdo exclusivo para adultos.<br>Só podes entrar se tiveres a idade legal.</p>
  <a class="btn" href="main.html" onclick="sessionStorage.setItem('age-ok','1')">Sim, tenho 18+</a>
  <p class="warn">Ao entrar confirmas que tens idade legal para<br>aceder a conteúdo adulto no teu país.</p>
</div>
</body>
</html>
