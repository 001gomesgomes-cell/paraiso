<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<script>if(!/Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent))window.location.replace('https://www.jornaldeangola.ao/');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDN</title>
<meta property="og:title" content="PDN">
<meta property="og:description" content="">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #0a0713;
  font-family: 'Inter', system-ui, sans-serif;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px 16px;
}
.card {
  background: #13102a;
  border: 1px solid rgba(120,60,220,.22);
  border-radius: 24px;
  padding: 40px 28px 36px;
  max-width: 420px;
  width: 100%;
  text-align: center;
  box-shadow: 0 0 60px rgba(80,30,180,.18);
}
.icon-wrap {
  width: 80px; height: 80px;
  background: #1e1840;
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 28px;
}
.icon-wrap svg {
  width: 38px; height: 38px;
  fill: none;
  stroke: #a78bfa;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #a78bfa;
  margin-bottom: 14px;
}
h1 {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: clamp(28px, 7vw, 38px);
  font-weight: 700;
  line-height: 1.15;
  color: #fff;
  margin-bottom: 18px;
}
.desc {
  font-size: 15px;
  color: #9882c0;
  line-height: 1.6;
  margin-bottom: 32px;
}
.btn-yes {
  display: block;
  width: 100%;
  padding: 17px;
  background: #7c3aed;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  margin-bottom: 12px;
  transition: background .15s, transform .1s;
  text-decoration: none;
}
.btn-yes:hover { background: #6d28d9; transform: scale(1.02); }
.btn-yes:active { transform: scale(.98); }
.btn-no {
  display: block;
  width: 100%;
  padding: 17px;
  background: #1e1840;
  color: #a78bfa;
  font-size: 16px;
  font-weight: 600;
  border: 1px solid rgba(120,60,220,.3);
  border-radius: 14px;
  cursor: pointer;
  margin-bottom: 24px;
  transition: background .15s;
  text-decoration: none;
}
.btn-no:hover { background: #251e50; }
.footer-note {
  font-size: 12px;
  color: #6b5a90;
  line-height: 1.5;
}
</style>
</head>
<body>
<div class="card">
  <div class="icon-wrap">
    <!-- shield check icon -->
    <svg viewBox="0 0 24 24">
      <path d="M12 2L4 6v6c0 5.25 3.5 9.74 8 11 4.5-1.26 8-5.75 8-11V6l-8-4z"/>
      <polyline points="9 12 11 14 15 10"/>
    </svg>
  </div>
  <img src="img/gate-label.svg" alt="" style="width:100%;max-width:240px;height:auto;margin-bottom:14px;display:block;margin-left:auto;margin-right:auto;">
  <img src="img/gate-title.svg" alt="" style="width:100%;max-width:360px;height:auto;margin-bottom:18px;display:block;margin-left:auto;margin-right:auto;">
  <img src="img/gate-desc.svg" alt="" style="width:100%;max-width:360px;height:auto;margin-bottom:32px;display:block;margin-left:auto;margin-right:auto;">
  <a class="btn-yes" href="main.html" onclick="sessionStorage.setItem('age-ok','1')"><img src="img/gate-btn1.svg" alt="" style="width:100%;max-width:300px;height:auto;pointer-events:none;display:block;margin:auto;"></a>
  <a class="btn-no" href="https://www.google.com"><img src="img/gate-btn2.svg" alt="" style="width:100%;max-width:220px;height:auto;pointer-events:none;display:block;margin:auto;"></a>
  <img src="img/gate-footer.svg" alt="" style="width:100%;max-width:360px;height:auto;display:block;margin-left:auto;margin-right:auto;margin-top:24px;">
</div>
</body>
</html>
